name: Audit feature branch subcategory references

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/audit-feature-subcategories.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/index-enhancements
      - name: Locate disputed subcategory data and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          patterns = {
              'fSub': re.compile(r'fSub'),
              'd.s': re.compile(r'\bd\.s\b'),
              'SUBS': re.compile(r'\bSUBS\b'),
              'subMap': re.compile(r'\bsubMap\b'),
              'small-category text': re.compile(r'小类'),
          }

          print(f'FILE_BYTES={len(text.encode("utf-8"))}')
          print(f'FILE_LINES={len(text.splitlines())}')
          for label, pattern in patterns.items():
              matches = list(pattern.finditer(text))
              print(f'COUNT[{label}]={len(matches)}')

          print('--- CONTEXT ---')
          for lineno, line in enumerate(text.splitlines(), 1):
              labels = [label for label, pattern in patterns.items() if pattern.search(line)]
              if labels:
                  compact = line.strip()
                  if len(compact) > 1200:
                      compact = compact[:1200] + ' ...[truncated]'
                  print(f'L{lineno} [{", ".join(labels)}] {compact}')
          PY
